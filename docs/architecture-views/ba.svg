<rect x="60" y="190" width="300" height="150" rx="6" fill="#f1f6f8" stroke="#90a6b2"/><text x="82" y="230" font-size="26" font-weight="600" fill="#193047">使用者选择日期</text><text x="82" y="268" font-size="21" font-weight="400" fill="#193047">查看预约 R01</text><text x="82" y="302" font-size="21" font-weight="400" fill="#193047">选择空闲时段 R02</text><rect x="460" y="190" width="430" height="150" rx="6" fill="#f1f6f8" stroke="#90a6b2"/><text x="482" y="230" font-size="26" font-weight="600" fill="#193047">核对业务规则 R03 / R06</text><text x="482" y="268" font-size="21" font-weight="400" fill="#193047">09:00—18:00，半小时刻度</text><text x="482" y="302" font-size="21" font-weight="400" fill="#193047">相邻允许；重叠拒绝</text><rect x="990" y="190" width="350" height="150" rx="6" fill="#f1f6f8" stroke="#90a6b2"/><text x="1012" y="230" font-size="26" font-weight="600" fill="#193047">形成有效预约</text><text x="1012" y="268" font-size="21" font-weight="400" fill="#193047">写入后持久可见 R05</text><text x="1012" y="302" font-size="21" font-weight="400" fill="#193047">失败时说明原因</text><path d="M360,265 L460,265" fill="none" stroke="#1b786e" stroke-width="3" marker-end="url(#arrow)"/><path d="M890,265 L990,265" fill="none" stroke="#1b786e" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="455" width="430" height="150" rx="6" fill="#f1f6f8" stroke="#90a6b2"/><text x="482" y="495" font-size="26" font-weight="600" fill="#193047">取消预约 R04</text><text x="482" y="533" font-size="21" font-weight="400" fill="#193047">取消指定记录</text><text x="482" y="567" font-size="21" font-weight="400" fill="#193047">释放全部占用格</text><path d="M1165,340 L1165,530" fill="none" stroke="#1b786e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1165,530 L890,530" fill="none" stroke="#1b786e" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="455" width="300" height="150" rx="6" fill="#f1f6f8" stroke="#90a6b2"/><text x="82" y="495" font-size="26" font-weight="600" fill="#193047">时段重新可用</text><text x="82" y="533" font-size="21" font-weight="400" fill="#193047">再次查询或建立预约</text><text x="82" y="567" font-size="21" font-weight="400" fill="#193047">验收责任由人承担</text><path d="M460,530 L360,530" fill="none" stroke="#1b786e" stroke-width="3" marker-end="url(#arrow)"/>
