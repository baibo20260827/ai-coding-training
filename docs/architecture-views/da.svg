<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="DA 数据架构">
<title>DA 数据架构</title><desc>实际表字段与关键约束；同一日期内的半开区间 [开始,结束)</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1b786e"/></marker></defs>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1400" height="800" fill="#ffffff"/>
<text x="60" y="72" font-size="38" font-weight="700" fill="#193047">DA 数据架构</text><text x="60" y="116" font-size="22" font-weight="400" fill="#52687a">实际表字段与关键约束；同一日期内的半开区间 [开始,结束)</text>
<rect x="100" y="190" width="510" height="350" rx="6" fill="#f1f6f8" stroke="#90a6b2"/><text x="122" y="230" font-size="26" font-weight="600" fill="#193047">bookings 预约记录</text><text x="122" y="268" font-size="21" font-weight="400" fill="#193047">id：TEXT，预约编号</text><text x="122" y="302" font-size="21" font-weight="400" fill="#193047">day：所选日期</text><text x="122" y="336" font-size="21" font-weight="400" fill="#193047">start_minute / end_minute</text><text x="122" y="370" font-size="21" font-weight="400" fill="#193047">name：虚构姓名</text><text x="122" y="404" font-size="21" font-weight="400" fill="#193047">purpose：预约主题</text><rect x="790" y="190" width="510" height="350" rx="6" fill="#f1f6f8" stroke="#90a6b2"/><text x="812" y="230" font-size="26" font-weight="600" fill="#193047">slots 半小时占用格</text><text x="812" y="268" font-size="21" font-weight="400" fill="#193047">day：所选日期</text><text x="812" y="302" font-size="21" font-weight="400" fill="#193047">start_minute：格开始分钟</text><text x="812" y="336" font-size="21" font-weight="400" fill="#193047">booking_id：外键 → bookings.id</text><text x="812" y="370" font-size="21" font-weight="400" fill="#193047">主键：(day, start_minute)</text><text x="812" y="404" font-size="21" font-weight="400" fill="#193047">删除预约时级联释放占用格</text><path d="M610,335 L790,335" fill="none" stroke="#1b786e" stroke-width="3" marker-end="url(#arrow)"/><text x="622" y="323" font-size="19" font-weight="400" fill="#1b786e">1 → 多</text><text x="100" y="600" font-size="26" font-weight="400" fill="#193047">10:00—11:00 → 占用 10:00 和 10:30 两格</text><text x="100" y="650" font-size="26" font-weight="400" fill="#193047">同一日期每格唯一；全部写入成功才提交，冲突时整体回滚</text>
<text x="60" y="742" font-size="21" font-weight="400" fill="#52687a">单会议室省略 room_id；多会议室或审批需求需重新评估数据与验收</text><text x="60" y="775" font-size="17" font-weight="400" fill="#52687a">CASE-ROOM-01 · 教学架构 v1.0 · 图源可编辑 · 真实客户环境待对齐</text>
</g></svg>